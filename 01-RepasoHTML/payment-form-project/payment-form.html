<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de pago</title>
  </head>
  <body>
    <form id="paymentForm" method="post">
      <fieldset>
        <legend>Información de contacto</legend>
        <label for="name">Nombre: </label>
        <input type="text" id="name" name="name" required />

        <label for="email">Correo: </label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña: </label>
        <input type="password" id="password" name="password" required />
      </fieldset>

      <fieldset>
        <legend>Información de pago</legend>

        <label for="cardType"> Tipo de tarjeta </label>
        <select id="cardType" name="cardType">
          <option value="Visa">Visa</option>
          <option value="Mastercard">Mastercard</option>
          <option value="American Express">American Express</option>
        </select>

        <label for="cardNumber">Numero de tarjeta: </label>
        <input type="number" id="cardNumber" name="cardNumber" required />

        <label for="expirationDate">Fecha de vencimiento: </label>
        <input type="text" id="expirationDate" name="expirationDate" required placeholder="MM/AA"/>
        
        <button type="submit">
            Validar el pago
        </button>

      </fieldset>
    </form>

    <a href="index.html">
    <button type="button">Ver pagos</button>
    </a>
    <script src="app.js"></script>
    <script> setupPaymentForm(); </script>
  </body>
</html>
